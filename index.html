<index.html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراجعة معمارية الحاسوب |_بواسطة علي خالد</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --success: #27ae60;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 { margin: 0; font-size: 2rem; }
        header p { margin-top: 10px; font-size: 1.1rem; opacity: 0.9; }
        
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-right: 5px solid var(--secondary);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        
        .question-en {
            font-family: monospace;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            direction: ltr;
            text-align: left;
        }
        
        .question-ar {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        
        .answer-section {
            display: none;
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 5px;
            margin-top: 1rem;
            border: 1px solid #dee2e6;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }
        
        button {
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-answer { background-color: var(--secondary); color: white; }
        .btn-answer:hover { background-color: #2980b9; }
        
        .btn-speak { background-color: var(--success); color: white; }
        .btn-speak:hover { background-color: #219a52; }
        
        footer {
            text-align: center;
            padding: 2rem;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>مراجعة معمارية الحاسوب</h1>
        <p>أهلاً بكم أبنائي الطلاب. قمت بإعداد هذه المنصة التفاعلية لمساعدتكم في مراجعة أهم مفاهيم معمارية الحاسوب. استمعوا للشرح واختبروا معلوماتكم!</p>
    </header>

    <div class="container" id="quiz-container">
        <!-- سيتم إدراج الأسئلة هنا بواسطة جافاسكربت -->
    </div>

    <footer>
        تم الإنشاء بحب لطلابي | استخدام تقنية Web Speech API للنطق
    </footer>

    <script>
        // بيانات الأسئلة والإجابات مستخرجة من ملف المراجعة
        const questions = [
            {
                en: "Explain the role of the Control Unit (CU) in coordinating computer operations.",
                ar: "اشرح دور وحدة التحكم (CU) في تنسيق عمليات الحاسوب.",
                answer: "وحدة التحكم (CU) هي بمثابة 'المدير' في المعالج. تقوم بجلب التعليمات من الذاكرة، وتفكيك تشفيرها لفهم المطلوب، ثم ترسل إشارات تحكم إلى باقي أجزاء الحاسوب (مثل وحدة الحساب والمنطق والذاكرة) لتنفيذ هذه التعليمات."
            },
            {
                en: "Describe the function of the Arithmetic Logic Unit (ALU) in data processing.",
                ar: "صِف وظيفة وحدة الحساب والمنطق (ALU) في معالجة البيانات.",
                answer: "وحدة الحساب والمنطق (ALU) هي الجزء المسؤول عن تنفيذ جميع العمليات الحسابية (مثل الجمع والطرح) والعمليات المنطقية (مثل المقارنات AND, OR). إنها بمثابة 'الآلة الحاسبة' داخل وحدة المعالجة المركزية."
            },
            {
                en: "Compare primary storage and secondary storage with suitable examples.",
                ar: "قارن بين التخزين الأساسي والتخزين الثانوي مع ذكر أمثلة مناسبة.",
                answer: "التخزين الأساسي (مثل RAM) سريع جداً ويتصل مباشرة بالمعالج لكنه يفقد بياناته عند انقطاع التيار (متطاير). أما التخزين الثانوي (مثل القرص الصلب HDD أو الفلاش) فهو أبطأ لكنه يحتفظ بالبيانات بشكل دائم (غير متطاير) وسعته أكبر بكثير."
            },
            {
                en: "Summarize the steps involved in the fetch–decode–execute cycle.",
                ar: "لخّص الخطوات المتضمنة في دورة الجلب والتشفير والتنفيذ (fetch-decode-execute cycle).",
                answer: "تتكون الدورة من ثلاث خطوات: 1. الجلب (Fetch): إحضار التعليمة التالية من الذاكرة الرئيسية. 2. فك التشفير (Decode): تفهم وحدة التحكم نوع العملية المطلوبة. 3. التنفيذ (Execute): تقوم وحدة الحساب والمنطق أو الأجزاء الأخرى بتنفيذ العملية وتخزين النتيجة."
            },
            {
                en: "State the meaning of primary memory and briefly compare Random Access Memory (RAM) and Read-Only Memory (ROM).",
                ar: "اذكر معنى الذاكرة الأساسية وقارن باختصار بين ذاكرة الوصول العشوائي (RAM) وذاكرة القراءة فقط (ROM).",
                answer: "الذاكرة الأساسية هي الذاكرة التي يتعامل معها المعالج مباشرة. الـ RAM هي ذاكرة قراءة وكتابة مؤقتة تُستخدم أثناء تشغيل البرامج وتفقد محتواها بإطفاء الجهاز. أما الـ ROM فهي ذاكرة للقراءة فقط تحتفظ بالبيانات الأساسية لإقلاع الحاسوب ولا تفقد محتواها."
            }
        ];

        const container = document.getElementById('quiz-container');

        // بناء الواجهة التفاعلية
        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div class="question-en">Q${index + 1}: ${q.en}</div>
                <div class="question-ar">السؤال: ${q.ar}</div>
                <div class="btn-group">
                    <button class="btn-answer" onclick="toggleAnswer(${index})">👁️ أظهر/أخفِ الإجابة</button>
                    <button class="btn-speak" onclick="speakText('${q.answer}')">🔊 استمع للإجابة</button>
                </div>
                <div class="answer-section" id="answer-${index}">
                    <strong>الإجابة:</strong> <br> ${q.answer}
                </div>
            `;
            container.appendChild(card);
        });

        // دالة إظهار وإخفاء الإجابة
        function toggleAnswer(id) {
            const answerDiv = document.getElementById(`answer-${id}`);
            if (answerDiv.style.display === 'block') {
                answerDiv.style.display = 'none';
            } else {
                answerDiv.style.display = 'block';
            }
        }

        // دالة النطق باللغة العربية
        function speakText(text) {
            // التحقق من دعم المتصفح لخاصية النطق
            if ('speechSynthesis' in window) {
                // إيقاف أي نطق سابق
                window.speechSynthesis.cancel(); 
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA'; // تعيين اللغة العربية
                utterance.rate = 0.9;     // سرعة القراءة (مناسبة للتعلم)
                utterance.pitch = 1;      // نبرة الصوت
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert("عذراً، متصفحك لا يدعم خاصية النطق الصوتي.");
            }
        }
    </script>
</body>
</html>
