<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة علي خالد للاختبارات | معمارية الحاسوب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --edu-blue: #0d47a1;
            --edu-light-blue: #e3f2fd;
            --success-green: #2e7d32;
            --error-red: #c62828;
            --text-dark: #202124;
            --bg-gray: #f8f9fa;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
        }
        header {
            background-color: var(--edu-blue);
            color: white;
            padding: 3rem 1rem;
            text-align: center;
            border-bottom: 5px solid #1565c0;
        }
        header h1 { margin: 0; font-size: 2.2rem; }
        .branding { color: #ffca28; font-weight: bold; margin-top: 10px; font-size: 1.1rem; }
        
        .container { max-width: 800px; margin: -40px auto 40px; padding: 20px; }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        
        .quiz-intro { text-align: center; margin-bottom: 20px; }
        
        .question-box { margin-bottom: 25px; display: none; }
        .question-box.active { display: block; }
        
        .q-text { font-size: 1.3rem; font-weight: 700; color: var(--edu-blue); margin-bottom: 15px; }
        .q-en { font-size: 0.9rem; color: #757575; font-style: italic; margin-bottom: 15px; direction: ltr; text-align: left; }
        
        .options-list { list-style: none; padding: 0; }
        .option-item {
            background: var(--edu-light-blue);
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }
        .option-item:hover { background: #bbdefb; }
        .option-item.selected { border-color: var(--edu-blue); background: #90caf9; }
        
        .controls { display: flex; justify-content: space-between; margin-top: 30px; }
        
        button {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.3s;
        }
        .btn-primary { background-color: var(--edu-blue); color: white; }
        .btn-audio { background-color: var(--success-green); color: white; }
        .btn-stop { background-color: var(--error-red); color: white; display: none; }
        
        #result-screen { text-align: center; display: none; }
        .score { font-size: 4rem; font-weight: bold; color: var(--edu-blue); }
        
        footer {
            background: #263238;
            color: white;
            text-align: center;
            padding: 20px;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>مركز علي خالد للاختبارات التقنية</h1>
    <div class="branding">الملكية الفكرية والحقوق محفوظة لـ: علي خالد</div>
</header>

<div class="container">
    <div class="card" id="quiz-container">
        <div id="start-screen" class="quiz-intro">
            <h2>اختبار معمارية الحاسوب الشامل</h2>
            <p>سيتم اختيار 10 أسئلة عشوائية من المنهج المعتمد. هل أنت مستعد؟</p>
            <button class="btn-primary" onclick="startQuiz()">ابدأ الاختبار الآن</button>
        </div>

        <div id="quiz-screen" style="display:none;">
            <div id="progress">سؤال 1 من 10</div>
            <hr>
            <div id="questions-area"></div>
            <div class="controls">
                <button class="btn-audio" id="audio-btn" onclick="speakCurrent()">🔊 قراءة السؤال</button>
                <button class="btn-stop" id="stop-btn" onclick="stopAudio()">⏹️ إيقاف</button>
                <button class="btn-primary" id="next-btn" onclick="nextQuestion()">السؤال التالي</button>
            </div>
        </div>

        <div id="result-screen">
            <h2>انتهى الاختبار!</h2>
            <p>نتيجتك النهائية هي:</p>
            <div class="score" id="final-score">0/10</div>
            <button class="btn-primary" onclick="location.reload()">إعادة الاختبار</button>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 جميع الحقوق محفوظة لـ علي خالد | معمارية الحاسوب
</footer>

<script>
// البيانات مستخرجة من المحتوى التعليمي
const allQuestions = [
    {q: "ما هو دور وحدة التحكم (CU)؟", en: "Role of Control Unit", options: ["تنسيق تدفق البيانات والتعليمات", "تنفيذ العمليات الحسابية", "تخزين البيانات الدائم", "إظهار المخرجات"], correct: 0, ans: "تقوم وحدة التحكم بتنسيق تدفق البيانات والتعليمات بين المعالج والمكونات الأخرى."},
    {q: "ما هي وظيفة وحدة الحساب والمنطق (ALU)؟", en: "Function of ALU", options: ["إدارة الذاكرة", "تنفيذ العمليات الحسابية والمنطقية", "تخزين الملفات", "ربط الحاسوب بالإنترنت"], correct: 1, ans: "تقوم الـ ALU بتنفيذ كافة العمليات الحسابية والمنطقية اللازمة للمعالجة[cite: 1]."},
    {q: "أي مما يلي يعتبر ذاكرة متطايرة؟", en: "Volatile Memory", options: ["HDD", "SSD", "RAM", "ROM"], correct: 2, ans: "تعتبر ذاكرة الـ RAM متطايرة لأنها تفقد محتواها عند انقطاع التيار[cite: 1]."},
    {q: "ما الفرق الجوهري للـ SSD عن الـ HDD؟", en: "SSD vs HDD", options: ["أبطأ في السرعة", "يعتمد على أقراص مغناطيسية", "أسرع ولا يحتوي قطع متحركة", "أرخص ثمناً"], correct: 2, ans: "الـ SSD إلكتروني بالكامل وأسرع بكثير من الـ HDD الميكانيكي[cite: 1]."},
    {q: "ما وظيفة المسجلات (Registers)؟", en: "Function of Registers", options: ["تخزين طويل الأمد", "تخزين فوري وفائق السرعة داخل المعالج", "طباعة المستندات", "إدخال البيانات"], correct: 1, ans: "المسجلات هي مخازن فائقة السرعة داخل المعالج مباشرة لسرعة المعالجة[cite: 1]."},
    {q: "ما هي معمارية فون نيومان؟", en: "Von Neumann Architecture", options: ["تستخدم ذاكرة واحدة للبيانات والتعليمات", "تفصل بين الذاكرتين", "تستخدم الورق للتخزين", "خاصة بالهواتف فقط"], correct: 0, ans: "معمارية فون نيومان تستخدم ذاكرة ونواقل مشتركة للبيانات والتعليمات[cite: 1]."},
    {q: "ما هي دورة جلب وتشفير وتنفيذ التعليمة؟", en: "Fetch-Decode-Execute Cycle", options: ["طريقة تنظيف الحاسوب", "خطوات تنفيذ المعالج لكل تعليمة", "طريقة شحن البطارية", "إعدادات الشاشة"], correct: 1, ans: "هي الخطوات التي يتبعها المعالج لجلب التعليمة ثم فهمها ثم تنفيذها[cite: 1]."},
    {q: "ما الفرق بين RISC و CISC؟", en: "RISC vs CISC", options: ["RISC تعليمات بسيطة وسريعة", "CISC تعليمات أبسط", "لا يوجد فرق", "كلاهما للذاكرة فقط"], correct: 0, ans: "الـ RISC تعتمد على مجموعة تعليمات بسيطة وسريعة التنفيذ[cite: 1]."},
    {q: "ما دور ذاكرة الكاش (Cache)؟", en: "Purpose of Cache", options: ["زيادة سعة التخزين", "تحسين سرعة النظام بتقليل وقت الوصول للبيانات", "تبريد المعالج", "حفظ كلمات المرور"], correct: 1, ans: "ذاكرة الكاش تزيد سرعة النظام بتخزين البيانات المتكررة قرب المعالج[cite: 1]."},
    {q: "أي من هؤلاء يمثل الوصول المباشر للبيانات؟", en: "Direct Access", options: ["شريط الكاسيت", "القرص الصلب (Hard Disk)", "الورق المطبوع", "الفأرة"], correct: 1, ans: "القرص الصلب يسمح بالوصول المباشر للبيانات دون المرور بكل ما قبله[cite: 1]."},
    {q: "ما هي معمارية هارفارد؟", en: "Harvard Architecture", options: ["ذاكرة مشتركة", "ذاكرتان منفصلتان للبيانات والتعليمات", "لا تستخدم ذاكرة", "قديمة جداً"], correct: 1, ans: "تتميز معمارية هارفارد بفصل مسارات وذاكرة التعليمات عن البيانات[cite: 1]."},
    {q: "مما تتكون وحدة المعالجة المركزية (CPU)؟", en: "CPU Components", options: ["CU, ALU, Registers", "Screen, Keyboard", "HDD, RAM", "Power Supply"], correct: 0, ans: "تتكون الـ CPU أساساً من وحدة التحكم ووحدة الحساب والمنطق والمسجلات[cite: 1]."},
    {q: "ما هي الذاكرة التي تحفظ تعليمات الإقلاع؟", en: "Boot instructions memory", options: ["RAM", "ROM", "Cache", "Virtual Memory"], correct: 1, ans: "ذاكرة الـ ROM هي التي تحفظ تعليمات الإقلاع الأساسية ولا تتأثر بانقطاع الكهرباء[cite: 1]."},
    {q: "ما دور نواقل النظام (System Buses)؟", en: "System Buses role", options: ["توليد الكهرباء", "ربط المكونات ونقل البيانات بينها", "تبريد الجهاز", "عرض الصور"], correct: 1, ans: "نواقل النظام هي المسارات التي تربط المعالج بالذاكرة وبقية الأجزاء[cite: 1]."},
    {q: "أين تقع أسرع ذاكرة في الحاسوب؟", en: "Fastest Memory Location", options: ["داخل المعالج (Registers)", "في القرص الصلب", "في الـ RAM", "في الإنترنت"], correct: 0, ans: "المسجلات هي أسرع أنواع الذاكرة لكونها داخل المعالج مباشرة[cite: 1]."},
    {q: "ما هو التخزين الثانوي؟", en: "Secondary Storage", options: ["الـ RAM", "القرص الصلب وذاكرة الفلاش", "الشاشة", "لوحة المفاتيح"], correct: 1, ans: "التخزين الثانوي هو التخزين الدائم مثل HDD و SSD[cite: 1]."},
    {q: "ما هي معمارية الحاسوب؟", en: "Definition of Computer Architecture", options: ["قواعد تنظيم وعمل أنظمة الحاسوب", "تصميم هيكل الحاسوب الخارجي", "طريقة صنع الشاشات", "برامج الألعاب"], correct: 0, ans: "معمارية الحاسوب هي القواعد والأساليب التي تصف تنظيم وعمل أنظمة الحاسوب[cite: 1]."}
];

let selectedQuestions = [];
let currentIdx = 0;
let userScore = 0;

function startQuiz() {
    // اختيار 10 عشوائياً
    selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 10);
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    renderQuestion();
}

function renderQuestion() {
    const q = selectedQuestions[currentIdx];
    document.getElementById('progress').innerText = `سؤال ${currentIdx + 1} من 10`;
    let html = `
        <div class="q-text">${q.q}</div>
        <div class="q-en">${q.en}</div>
        <div class="options-list">
            ${q.options.map((opt, i) => `
                <div class="option-item" onclick="selectOption(${i})" id="opt-${i}">${opt}</div>
            `).join('')}
        </div>
    `;
    document.getElementById('questions-area').innerHTML = html;
}

let selectedAnswer = null;
function selectOption(i) {
    selectedAnswer = i;
    document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt-${i}`).classList.add('selected');
}

function nextQuestion() {
    if (selectedAnswer === null) {
        alert("يرجى اختيار إجابة قبل الانتقال!");
        return;
    }
    
    if (selectedAnswer === selectedQuestions[currentIdx].correct) {
        userScore++;
    }

    selectedAnswer = null;
    currentIdx++;
    
    if (currentIdx < 10) {
        renderQuestion();
        stopAudio();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('final-score').innerText = `${userScore}/10`;
}

function speakCurrent() {
    window.speechSynthesis.cancel();
    const q = selectedQuestions[currentIdx];
    const text = `السؤال: ${q.q}. الخيارات هي: ${q.options.join('... ')}`;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ar-SA';
    utter.onstart = () => {
        document.getElementById('audio-btn').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'inline-block';
    };
    utter.onend = () => stopAudio();
    window.speechSynthesis.speak(utter);
}

function stopAudio() {
    window.speechSynthesis.cancel();
    document.getElementById('audio-btn').style.display = 'inline-block';
    document.getElementById('stop-btn').style.display = 'none';
}
</script>
</body>
</html>
